[package]
name = "whisplay"
version = "0.1.0"
edition = "2021"
description = "Native Rust LCD driver for the PiSugar WhisPlay HAT"
license = "MIT"

[dependencies]
gpio-cdev = "0.6"
spidev = "0.6"
