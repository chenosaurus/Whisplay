[package]
name = "whisplay"
version = "0.1.0"
edition = "2021"
description = "Native Rust LCD driver for the PiSugar WhisPlay HAT"
license = "MIT"

[dependencies]
gpio-cdev = "0.6"
minifb = { version = "0.28.0", optional = true }
spidev = "0.6"
thiserror = "1"

[features]
default = []
emulator = ["dep:minifb"]

[dev-dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
ctrlc = { version = "3.5.2", features = ["termination"] }
embedded-graphics = "0.8.2"
env_logger = "0.11"
futures-util = "0.3"
libwebrtc = "0.3.30"
livekit = { version = "0.7.37", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.4.19", features = ["rustls-tls-native-roots"] }
log = "0.4"
rand = "0.10.1"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "play_mp4"
path = "examples/play_mp4.rs"

[[example]]
name = "frame_bench"
path = "examples/frame_bench.rs"

[[example]]
name = "avatar"
path = "examples/avatar.rs"

[[example]]
name = "avatar_client"
path = "examples/avatar_client.rs"
